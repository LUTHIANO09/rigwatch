{% extends 'wells/base.html' %}

{% block title %}Well List — RigWatch{% endblock %}

{% block content %}
<h1>Active Wells</h1>
<ul>
{% for well in wells %}
    <li>
        <a href="{% url 'well-detail' well_id=well.id %}">
            {{well.id}} - {{ well.name }} — {{ well.status }} — {{ well.pressure }} psi
        </a>
    </li>
{% empty %}
    <li>No wells found.</li>
{% endfor %}
</ul>
{% endblock %}
